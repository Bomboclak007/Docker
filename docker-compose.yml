services:
    web-app:
        build: ./app
        container_name: web-app
        ports:
            - '3000:3000'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            database:
                condition: service_started

    database:
        build: ./database
        container_name: database
        ports:
            - '4000:4000'
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:17
        container_name: postgres
        environment:
            POSTGRES_DB: requests
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5444:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d requests"]
            interval: 3s
            timeout: 3s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: redis
        ports:
            - '6380:6379'
        volumes:
            - redis_data:/data
        command: ["redis-server", "--appendonly", "yes"]
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 3s
            timeout: 3s
            retries: 10

    test:
        build: ./test
        container_name: test
        depends_on:
            web-app:
                condition: service_started
            postgres:
                condition: service_healthy

volumes:
    postgres_data:
    redis_data: